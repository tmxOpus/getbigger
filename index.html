<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>GetBigger</title>
<meta name="description" content="Дневник питания и план тренировок для спортсменов: калории, БЖУ, упражнения и подсказки, чем добрать норму.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F1F4F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101514" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GetBigger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap">
<style>
/* Layout: одна колонка-«этикетка» с жирными линейками, как таблица пищевой ценности на упаковке;
   цифры набраны узким табло-шрифтом, всё остальное — спокойный гротеск. */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --ink:#15201D; --muted:#5C6965; --line:#D5DCD9; --soft:#E7ECEA;
  --accent:#0B6B50; --accent-ink:#FFFFFF;
  --prot:#B23A4E; --carb:#B97F00; --fat:#2A68AD; --warn:#B4441F;
  --display:"Oswald","Arial Narrow","Roboto Condensed",sans-serif;
  --text:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101514; --surface:#18201E; --ink:#E7ECEA; --muted:#94A19D; --line:#2C3633; --soft:#212A27;
  --accent:#4FC19B; --accent-ink:#0C1513;
  --prot:#E97C8E; --carb:#E3B040; --fat:#73A9E8; --warn:#F08A5D; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101514; --surface:#18201E; --ink:#E7ECEA; --muted:#94A19D; --line:#2C3633; --soft:#212A27;
  --accent:#4FC19B; --accent-ink:#0C1513;
  --prot:#E97C8E; --carb:#E3B040; --fat:#73A9E8; --warn:#F08A5D; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--text);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:22px 10px}
.brand{font:600 26px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.brand small{font:400 13px/1 var(--text);letter-spacing:0;text-transform:none;color:var(--muted);margin-left:10px}
.status{font-size:12.5px;color:var(--muted)}
.topr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:3px solid var(--ink);margin-bottom:24px}
.tabs a{padding:9px 14px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap;border-radius:6px 6px 0 0}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}

.note{background:var(--soft);border-left:3px solid var(--accent);padding:10px 14px;margin-bottom:20px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note.warn{border-left-color:var(--warn)}
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:32px;align-items:start}
.cols>*{min-width:0}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr);gap:28px}}
.stack{display:flex;flex-direction:column;gap:28px}
h2{font:600 20px/1.2 var(--display);letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
h3{font:600 15px/1.3 var(--text)}
.sub{color:var(--muted);font-size:13.5px}
.sec{display:flex;flex-direction:column;gap:12px}
.prose{max-width:66ch;display:flex;flex-direction:column;gap:10px}
.ref{color:var(--muted);font-size:12px;white-space:nowrap}

/* Этикетка */
.label{background:var(--surface);border:1.5px solid var(--ink);padding:14px 16px 12px}
.label h2{padding-bottom:8px;border-bottom:8px solid var(--ink)}
.lrow{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow b{font-weight:600}
.lrow.thick{border-bottom:4px solid var(--ink)}
.lrow .v{font-variant-numeric:tabular-nums;text-align:right}
.big{font:600 52px/1 var(--display);font-variant-numeric:tabular-nums}
.bigrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:12px 0 10px;flex-wrap:wrap}
.bigrow .cap{color:var(--muted);font-size:13.5px;text-align:right}
.bar{height:8px;background:var(--soft);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink);transition:width .25s}
.bar.p i{background:var(--prot)} .bar.c i{background:var(--carb)} .bar.f i{background:var(--fat)}
.bar.over i{background:var(--warn)}
.macro{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.macro .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.macro .left{font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;margin-right:7px}
.dot.p{background:var(--prot)} .dot.c{background:var(--carb)} .dot.f{background:var(--fat)} .dot.k{background:var(--ink)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* Формы */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:13px;color:var(--muted)}
input[type=number],input[type=text],input[type=search],input[type=password],select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0}
input:hover,select:hover{border-color:var(--muted)}
.fgrid{align-items:end;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid .wide{grid-column:1/-1}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg label{flex:1;text-align:center;padding:9px 8px;cursor:pointer;border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--bg)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.goals{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.goals label{display:flex;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line);align-items:baseline}
.goals label:last-child{border-bottom:0}
.goals label:has(input:checked){background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
.goals small{display:block;color:var(--muted);font-size:13px}
.btn{display:inline-block;text-decoration:none;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.ghost:hover{border-color:var(--ink);filter:none}
.btn.sm{padding:5px 10px;font-size:13px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:4px;font-size:16px;line-height:1}
.x:hover{color:var(--warn);background:var(--soft)}

/* Дневник */
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.datebar h2{margin:0 6px;min-width:0}
.found{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.found button{display:flex;justify-content:space-between;gap:10px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 10px;cursor:pointer}
.found button:last-child{border-bottom:0}
.found button:hover,.found button[aria-pressed=true]{background:var(--soft)}
.found small{color:var(--muted);white-space:nowrap}
.addrow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.addrow .field{flex:0 0 110px}
.addrow .pv{flex:1 1 160px;font-size:13px;color:var(--muted);min-width:0;padding-bottom:9px}
.entries{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.entries li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.entries .m{grid-column:1/2;font-size:12.5px;color:var(--muted)}
.entries .kc{font-variant-numeric:tabular-nums;font-weight:600;grid-row:1/3;grid-column:2}
.entries .x{grid-row:1/3;grid-column:3}
.empty{color:var(--muted);padding:14px 0;border-bottom:1px solid var(--line)}
.idea{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.idea>div{min-width:0;flex:1 1 260px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end}
.wd{display:flex;flex-direction:column;gap:5px;align-items:center;background:none;border:0;cursor:pointer;padding:0}
.wd .col{width:100%;height:92px;background:var(--soft);position:relative}
.wd .col i{position:absolute;inset:auto 0 0 0;background:var(--ink)}
.wd .col.over i{background:var(--warn)}
.wd .col::after{content:"";position:absolute;left:0;right:0;bottom:66.6%;border-top:1.5px dashed var(--muted)}
.wd small{font-size:12px;color:var(--muted)}
.wd[aria-current=date] small{color:var(--ink);font-weight:700}
details summary{cursor:pointer;color:var(--muted);font-size:13.5px}
details[open] summary{margin-bottom:10px}

/* Таблицы */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:500;color:var(--muted);font-size:12.5px;text-align:left;padding:6px 10px 6px 0;border-bottom:2px solid var(--ink)}
td{padding:7px 10px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-right:0;padding-left:10px}
tr.sum td{font-weight:600;border-bottom:0;border-top:2px solid var(--ink)}
tr.meal td{font-weight:600;padding-top:14px;border-bottom-color:var(--ink)}

/* Тренировки */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1.5px solid var(--ink);background:var(--surface)}
.wk div{padding:8px 6px 10px;border-right:1px solid var(--line);min-width:0;text-align:center}
.wk div:last-child{border-right:0}
.wk small{display:block;color:var(--muted);font-size:12px}
.wk b{font:600 13px/1.25 var(--text);display:block;overflow-wrap:anywhere}
.wk .on{background:var(--ink);color:var(--bg)} .wk .on small{color:inherit;opacity:.7}
.wk .off b{color:var(--muted);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px 18px}
.chips span{font-size:14px} .chips b{font:600 18px/1 var(--display);margin-right:5px;font-variant-numeric:tabular-nums}
.src{padding-left:22px;display:flex;flex-direction:column;gap:9px;max-width:80ch;margin:0}
.src li{padding-left:4px} .src em{color:var(--muted);font-style:normal;display:block;font-size:13.5px}

/* Замок */
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));overflow:auto}
.lockbox{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
.lockbox .brand{padding-bottom:12px;border-bottom:8px solid var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#security{border-top:3px solid var(--ink);padding-top:22px;margin-top:36px}
#security h3{margin-top:10px}

/* Телефон: нижняя панель разделов, крупные поля и кнопки под палец */
@media (max-width:640px){
  body{font-size:16px;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .top{padding-block:14px 12px;align-items:center;border-bottom:3px solid var(--ink);margin-bottom:18px}
  .brand{font-size:23px}
  .top{flex-wrap:nowrap}
  .topr{flex-direction:column-reverse;align-items:flex-end;gap:4px;flex-wrap:nowrap}
  .status{font-size:11px;text-align:right}
  .brand small{display:none}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;gap:0;overflow:visible;background:var(--surface);border-bottom:0;border-top:1.5px solid var(--ink);
    padding:0 max(4px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(4px,env(safe-area-inset-left,0px))}
  .tabs a{flex:1 1 0;min-width:0;text-align:center;padding:17px 2px 15px;font-size:11.5px;border-radius:0;box-shadow:inset 0 3px 0 transparent}
  .tabs a[aria-current="page"]{background:none;color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
  input:not([type=radio]),select{font-size:16px;min-height:46px}
  .btn{min-height:44px}
  .btn.sm{min-height:40px;padding:8px 14px;font-size:14px}
  .x{min-width:44px;min-height:44px;font-size:22px}
  .found button{flex-direction:column;gap:2px;padding:12px 10px}
  .big{font-size:44px}
  .label{padding:12px 12px 10px}
  .addrow .field{flex:1 1 100%}
  .addrow .pv{flex:1 1 100%;padding:0}
  .addrow .btn{flex:1 1 100%}
  .goals label,.seg label{padding-block:13px}
  .wk div{padding:8px 2px}
  .wk b{font-size:11px}
  .datebar h2{flex:1 1 0;font-size:17px;text-align:center}
  .cols{gap:32px}
  table{font-size:13.5px}
  details summary{padding-block:10px}
}
</style>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand">GetBigger<small>дневник питания и план для тех, кто тренируется</small></div>
    <div class="topr"><div class="status" id="status" aria-live="polite"></div><button class="btn ghost sm" id="install" hidden>Установить</button></div>
  </header>
  <div class="note" id="howto" hidden><span id="howto-text"></span></div>
  <nav class="tabs" id="tabs" aria-label="Разделы">
    <a href="#day">Дневник</a><a href="#nutrition">Питание</a><a href="#training">Тренировки</a><a href="#profile">Профиль</a><a href="#sources">Источники</a>
  </nav>
  <main id="view"></main>
</div>
<div id="lock" hidden>
  <form id="lock-form" class="lockbox">
    <div class="brand">GetBigger</div>
    <p id="lock-text"></p>
    <label class="field"><span>Код-пароль</span><input type="password" id="lock-pass" autocomplete="current-password"></label>
    <button class="btn" type="submit">Открыть</button>
    <p class="sub" id="lock-msg" aria-live="polite"></p>
    <button class="btn ghost sm" type="button" id="lock-alt"></button>
  </form>
</div>

<script src="app.js"></script>

</body>
</html>
